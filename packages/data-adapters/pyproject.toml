[project]
name = "openwind-data"
version = "0.1.0"
description = "Marine data adapters, polars, routing, and complexity scoring for OhMyWind"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwind_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]


# Basic mode, not strict. The point is to catch the class of bug the 2026-09
# audit found by reading: an attribute probed with `hasattr` that no class in
# the codebase defines, a method called through a Protocol that does not
# declare it, an `Optional` used without being filtered. Strict mode would
# also demand annotations on every local and would drown those in noise.
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
