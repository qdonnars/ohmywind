[project]
name = "openwind-api"
version = "0.1.0"
description = "OhMyWind REST API: a Starlette app that serves passage planning, with no deployment and no MCP dependency."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"

# No `mcp` here, on purpose. This package must stay installable and testable
# without the MCP SDK: `create_app(settings)` boots and serves the whole REST
# surface with no MCP server behind it, and a deployment that wants both hands
# the mounted app in. That is what makes the MCP surface freezable without
# touching the API, and the API redeployable without carrying the MCP SDK.
dependencies = [
    "openwind-data",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.390",
    # The MARC golden writes a one-cell atlas to disk; polars is already a
    # transitive dependency through openwind-data, declared here so the test
    # dependency is visible rather than inherited by luck.
    "polars>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwind_api"]

[tool.uv.sources]
openwind-data = { path = "../data-adapters", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]


# See packages/data-adapters/pyproject.toml for why basic and not strict.
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
