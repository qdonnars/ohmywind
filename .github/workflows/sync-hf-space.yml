name: Sync HF Space

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/hf-space/**"
      - "packages/api/**"
      - "packages/mcp-core/**"
      - "packages/data-adapters/**"
      - ".github/workflows/sync-hf-space.yml"
  workflow_dispatch:

# Single source of truth = this repo. The HF Space repos are treated as mirrors;
# any direct commit there will be overwritten on the next sync.
# main -> prod Space, dev -> dev Space (resolved per-branch below). The HF_TOKEN
# secret must have write access to BOTH Spaces (a single qdonnars user token does).
jobs:
  # Gate. The Space is a production surface and mirroring a broken commit to
  # it used to be entirely possible: nothing ran the suites before this push.
  # Calling the CI workflow rather than duplicating its steps keeps a single
  # definition of "green".
  ci:
    uses: ./.github/workflows/ci.yml

  sync:
    needs: ci
    runs-on: ubuntu-latest
    env:
      # Override via repo Variables → Actions if you renamed a Space.
      HF_SPACE_ID_PROD: ${{ vars.HF_SPACE_ID || 'qdonnars/openwind-mcp' }}
      HF_SPACE_ID_DEV: ${{ vars.HF_SPACE_ID_DEV || 'qdonnars/openwind-mcp-dev' }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v7

      - name: Resolve target Space
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TARGET="${HF_SPACE_ID_PROD}"
          else
            TARGET="${HF_SPACE_ID_DEV}"
          fi
          echo "HF_SPACE_ID=${TARGET}" >> "$GITHUB_ENV"
          echo "Branch ${GITHUB_REF_NAME} -> Space ${TARGET}"

      - name: Assemble Space build context
        run: |
          set -euo pipefail
          BUILD_DIR=/tmp/hf-build
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/vendor"
          cp -R packages/hf-space/. "$BUILD_DIR/"
          cp -R packages/data-adapters "$BUILD_DIR/vendor/data-adapters"
          cp -R packages/api           "$BUILD_DIR/vendor/api"
          cp -R packages/mcp-core      "$BUILD_DIR/vendor/mcp-core"
          # Strip artefacts that don't belong on the Space.
          find "$BUILD_DIR/vendor" -type d \( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache -o -name tests \) -prune -exec rm -rf {} +
          find "$BUILD_DIR/vendor" -type f -name "*.pyc" -delete
          # The vendored packages build from their own pyproject, so their
          # lockfiles and venvs are dead weight on the Space.
          find "$BUILD_DIR/vendor" -maxdepth 2 -name uv.lock -delete
          find "$BUILD_DIR/vendor" -maxdepth 2 -type d -name .venv -prune -exec rm -rf {} +
          rm -f "$BUILD_DIR/.gitignore"
          # Dev-only artefacts of the wrapper itself. The Space builds from the
          # Dockerfile, so its pyproject, lockfile, venv, lint config and test
          # suite are dead weight there — and the tests would be the only files
          # on the Space importing pytest.
          rm -rf "$BUILD_DIR/tests" "$BUILD_DIR/.venv" "$BUILD_DIR/.pytest_cache"
          rm -f "$BUILD_DIR/pyproject.toml" "$BUILD_DIR/uv.lock" "$BUILD_DIR/.ruff.toml"
          ls -la "$BUILD_DIR"
          ls -la "$BUILD_DIR/vendor"

      - name: Variabilize README for the dev Space
        if: ${{ github.ref_name != 'main' }}
        run: |
          set -euo pipefail
          # The committed README carries the prod Space's metadata. On the dev
          # Space, rewrite the HF card frontmatter and the advertised endpoint so
          # the two Spaces are visually distinct on the dashboard and demos hit dev.
          README=/tmp/hf-build/README.md
          # NB: the title / heading patterns below match the committed README
          # verbatim. sed reports nothing when a pattern misses, so any edit to
          # those two lines in packages/hf-space/README.md must be mirrored here
          # or the dev Space silently stops being distinguishable from prod.
          sed -i \
            -e 's/^title: OhMyWind MCP$/title: OhMyWind MCP (dev)/' \
            -e 's/^colorFrom: blue$/colorFrom: gray/' \
            -e 's/^colorTo: indigo$/colorTo: yellow/' \
            -e 's/^short_description: .*/short_description: (dev) Sailing passage planner for any coast, via MCP./' \
            -e 's/^# OhMyWind MCP ⛵$/# OhMyWind MCP (dev) ⛵/' \
            -e 's#mcp\.ohmywind\.fr#mcp-dev.ohmywind.fr#g' \
            -e 's/on `main`/on `dev`/g' \
            "$README"
          echo "Patched dev README frontmatter:"
          sed -n '1,13p' "$README"

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GIT_USER_NAME: openwind-ci
          GIT_USER_EMAIL: ci@ohmywind.fr
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not set"
            exit 1
          fi
          BUILD_DIR=/tmp/hf-build
          SPACE_DIR=/tmp/hf-space
          rm -rf "$SPACE_DIR"
          git clone --depth 1 "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" "$SPACE_DIR"
          cd "$SPACE_DIR"
          # Replace contents wholesale (preserve .git).
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$BUILD_DIR/." ./
          git lfs install --local || true
          # The Hub's pre-receive hook rejects binary blobs that aren't in
          # Xet/LFS storage, whatever their size, and the wholesale copy above
          # takes the Space's default .gitattributes down with it. Re-declare
          # tracking for the binaries we actually ship (the landing demo), or
          # the push dies with "your push was rejected because it contains
          # binary files". Written before `git add` so the filter runs.
          printf '%s\n' '*.mp4 filter=lfs diff=lfs merge=lfs -text' > .gitattributes
          git config user.name  "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push."
            exit 0
          fi
          SHA="${GITHUB_SHA::7}"
          git commit -m "sync: github ${SHA}"
          git push
