[project]
name = "openwind-hf-space"
version = "0.1.0"
description = "Hugging Face Spaces wrapper: the OhMyWind REST API with the MCP server mounted behind it."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"

# Two libraries and a runner. Everything else moved out in lot 2: the REST
# surface is openwind-api, the MCP tools are openwind-mcp-core, and neither
# knows about Hugging Face. Keep in sync with the Dockerfile, which is the
# real deployment contract (test_dependency_parity.py enforces it).
dependencies = [
    "openwind-api",
    "openwind-mcp-core",
    "uvicorn[standard]>=0.30",
    # fetch_atlases.py pulls the tidal atlas dataset at image build time.
    "huggingface_hub[hf_xet]>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# Not an installable package: the Space runs `python /app/app.py` on files the
# sync workflow copies flat into the image, with no src layout and no wheel.
# Declaring it as a virtual project gives us an environment without asking uv
# to build something that was never meant to be built.
[tool.uv]
package = false

[tool.uv.sources]
openwind-api = { path = "../api", editable = true }
openwind-mcp-core = { path = "../mcp-core", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Ruff configuration deliberately stays in .ruff.toml: it predates this file
# and ruff would ignore a [tool.ruff] table here while .ruff.toml exists.
