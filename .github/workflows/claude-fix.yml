name: Claude Fix

# Agent d'implémentation, armé manuellement : c'est le label agent:fix posé
# PAR qdonnars qui déclenche, issue par issue. Jamais sur issues: [opened] —
# repo public, texte non trusté, pas d'agent avec write access dessus.
#
# Pipeline : label agent:fix → branche fix/issue-NN- depuis dev → PR draft
# vers dev → ci.yml (ruff + pytest + typecheck + vitest + build) fait le gate
# → review humaine. Pour itérer : « @claude <feedback> » en commentaire de PR
# (claude.yml), repush sur la même branche. La promotion dev → main reste
# manuelle : l'agent s'arrête à dev.

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event.label.name == 'agent:fix' &&
      github.event.sender.login == 'qdonnars'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # persist-credentials: false — sinon le GITHUB_TOKEN par défaut reste
      # dans la config git et les pushes de l'agent partiraient avec lui :
      # GitHub ne déclenche aucun workflow sur ces événements, donc ci.yml ne
      # tournerait jamais sur la PR. Sans lui, le seul credential restant est
      # celui que l'action installe (app Claude) → les pushes déclenchent CI.
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      # Pas d'input github_token : l'action s'authentifie comme la Claude
      # GitHub App (cf. checkout ci-dessus).
      # Pas de track_progress : en mode tag, l'action REMPLACE --allowedTools
      # par sa toolbox interne (Read + git add/commit + git-push.sh, sans
      # Edit/Write ni gh) — constaté au run 31736398989. En mode agent pur,
      # l'allowlist ci-dessous fait foi et le prompt pilote tout le flow.
      #
      # GH_TOKEN : sans lui, gh n'est pas authentifié dans le process de
      # l'agent (constaté au run 31737271536 : l'étape 1 du prompt échouait
      # dès le premier tour). Conséquence assumée : la PR est créée par
      # github-actions[bot], dont les événements ne déclenchent pas de
      # workflow — c'est pour ça que ci.yml écoute aussi les push sur fix/**
      # (les pushes, eux, viennent de l'app Claude et déclenchent bien).
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          prompt: |
            Tu traites l'issue #${{ github.event.issue.number }}, que qdonnars
            vient de marquer agent:fix.

            1. Lis-la avec `gh issue view ${{ github.event.issue.number }} --comments`.
            2. Crée la branche `fix/issue-${{ github.event.issue.number }}`
               depuis dev (le checkout est déjà sur dev) et implémente le fix
               minimal qui résout l'issue. En cas d'ambiguïté, choisis
               l'interprétation la plus conservatrice et note l'hypothèse dans
               le corps de la PR.
            3. Respecte CLAUDE.md : conventions du repo, domaine voile (nœuds,
               caps vrais…), conventional commits. Exception runner CI :
               ignore la consigne worktree, travaille dans le checkout.
            4. Si c'est rapide, lance les tests du périmètre touché avant de
               committer (utilise `cd` seul pour changer de dossier, jamais
               de commande composée) :
               - Python : `uv sync --extra dev` puis `uv run pytest -q` dans le
                 package modifié, et `uvx ruff check` + `uvx ruff format --check`
               - Web : `npm ci` à la racine puis `npm run typecheck` et
                 `npm run test` dans packages/web
               Ne t'acharne pas : la CI de la PR fait le gate final. Mieux vaut
               une PR poussée sans tests locaux qu'un run à sec sans PR.
            5. Ouvre une PR DRAFT vers dev (jamais main) :
               `gh pr create --base dev --draft`, titre en conventional commit
               référençant l'issue, corps contenant « Closes #${{ github.event.issue.number }} »,
               le résumé du fix et les hypothèses prises.
            6. Termine par un commentaire sur l'issue avec le lien de la PR.

            Si le fix exige une décision produit, touche à la sécurité ou
            dépasse largement le cadre d'un fix (refonte, migration), n'ouvre
            pas de PR : commente l'issue en expliquant le blocage et propose
            un découpage.

            Contrainte outillage : commandes SIMPLES uniquement, sans pipe,
            redirection ni enchaînement (&&) — elles seraient refusées par
            l'allowlist et chaque refus gaspille un tour.
          claude_args: |
            --max-turns 50
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash(cd:*),Bash(ls:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(npm:*),Bash(uv:*),Bash(uvx:*)"
