import groovy.json.JsonSlurper
import groovy.xml.XmlUtil
import java.nio.file.Files
import java.nio.file.StandardCopyOption

apply plugin: 'com.android.application'

// The variant (prod, dev, local) is chosen once, by OHMYWIND_VARIANT when
// `npx cap sync android` writes this file. Reading appId, appName and the
// server URL back from it, rather than declaring Gradle flavors, means the
// applicationId can never disagree with the site the WebView loads.
def shellConfigFile = file('src/main/assets/capacitor.config.json')
if (!shellConfigFile.isFile()) {
    throw new GradleException(
        "${shellConfigFile} is missing. Run `OHMYWIND_VARIANT=dev npx cap sync android` " +
        "(or prod, or local) in packages/mobile before building."
    )
}
def shellConfig = new JsonSlurper().parse(shellConfigFile)
def shellAppId = shellConfig.appId as String
def shellAppName = shellConfig.appName as String
def shellServerUrl = (shellConfig.server?.url as String)?.replaceAll('/+$', '')
def shellVariant = shellConfig.plugins?.ShellInfo?.variant as String
if (!shellAppId || !shellAppName || !shellServerUrl || !shellVariant) {
    throw new GradleException("${shellConfigFile} lacks appId, appName, server.url or the variant. Re-run cap sync.")
}

// dev and local share an applicationId; the file name is what tells the two
// APKs apart: app/build/outputs/apk/debug/ohmywind-<variant>-debug.apk.
base {
    archivesName = "ohmywind-${shellVariant}"
}

// The launcher and shortcut icons are the PWA's own, read straight from the web
// package so the two never drift apart.
def webPublicDir = rootProject.file('../../web/public')

/**
 * Writes the resources that depend on the variant or come from the web package.
 *
 * App shortcuts must be generated per variant: the system parses
 * res/xml shortcuts with its own Resources (ShortcutParser), so
 * android:targetPackage and android:data cannot point at a string resource
 * and have to be literal values.
 */
abstract class GenerateShellResources extends DefaultTask {
    // Web asset file name -> drawable name in the APK.
    static final Map<String, String> ICONS = [
        'icon-512.png'           : 'shell_icon_legacy',
        'icon-maskable-512.png'  : 'shell_icon_maskable',
        'icon-monochrome-512.png': 'shell_icon_monochrome',
        'shortcut-plan-192.png'  : 'shell_shortcut_plan',
        'shortcut-config-192.png': 'shell_shortcut_config',
    ]

    // Same entries and paths as twa-manifest.json and the web manifest.
    static final List<Map<String, String>> SHORTCUTS = [
        [id: 'plan', path: '/plan', icon: 'shell_shortcut_plan', label: 'shell_shortcut_plan'],
        [id: 'config', path: '/config', icon: 'shell_shortcut_config', label: 'shell_shortcut_config'],
    ]

    @Input
    abstract Property<String> getAppId()

    @Input
    abstract Property<String> getActivityClass()

    @Input
    abstract Property<String> getServerUrl()

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getIconFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        File out = outputDirectory.get().asFile
        out.deleteDir()

        File drawables = new File(out, 'drawable-nodpi')
        drawables.mkdirs()
        ICONS.each { String webName, String drawableName ->
            File src = iconFiles.files.find { it.name == webName }
            if (src == null || !src.isFile()) {
                throw new GradleException("Icon ${webName} is missing from packages/web/public.")
            }
            File dest = new File(drawables, drawableName + '.png')
            Files.copy(src.toPath(), dest.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }

        String pkg = XmlUtil.escapeXml(appId.get())
        String cls = XmlUtil.escapeXml(activityClass.get())
        StringBuilder xml = new StringBuilder()
        xml << '<?xml version="1.0" encoding="utf-8"?>\n'
        xml << '<!-- Generated by app/build.gradle (GenerateShellResources). Do not edit. -->\n'
        xml << '<shortcuts xmlns:android="http://schemas.android.com/apk/res/android">\n'
        SHORTCUTS.each { s ->
            String data = XmlUtil.escapeXml(serverUrl.get() + s.path)
            xml << "    <shortcut\n"
            xml << "        android:shortcutId=\"${s.id}\"\n"
            xml << "        android:enabled=\"true\"\n"
            xml << "        android:icon=\"@drawable/${s.icon}\"\n"
            xml << "        android:shortcutShortLabel=\"@string/${s.label}_short\"\n"
            xml << "        android:shortcutLongLabel=\"@string/${s.label}_long\">\n"
            // ACTION_VIEW with the page URL: @capacitor/app hands it to the
            // site as appUrlOpen (warm start) or getLaunchUrl() (cold start).
            xml << "        <intent\n"
            xml << "            android:action=\"android.intent.action.VIEW\"\n"
            xml << "            android:targetPackage=\"${pkg}\"\n"
            xml << "            android:targetClass=\"${cls}\"\n"
            xml << "            android:data=\"${data}\" />\n"
            xml << "    </shortcut>\n"
        }
        xml << '</shortcuts>\n'

        File xmlDir = new File(out, 'xml')
        xmlDir.mkdirs()
        new File(xmlDir, 'shell_shortcuts.xml').setText(xml.toString(), 'UTF-8')
    }
}

def generateShellResources = tasks.register('generateShellResources', GenerateShellResources) {
    appId = shellAppId
    activityClass = 'fr.ohmywind.app.MainActivity'
    serverUrl = shellServerUrl
    iconFiles.from(GenerateShellResources.ICONS.keySet().collect { new File(webPublicDir, it) })
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(generateShellResources) { it.outputDirectory }
    }
}

android {
    // The Java package stays fr.ohmywind.app for every variant; only the
    // applicationId below changes.
    namespace = "fr.ohmywind.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        resValues = true
    }
    defaultConfig {
        applicationId shellAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The TWA published versionCode 8 under fr.ohmywind.app: the shell has
        // to stay above it to ship as an update of the same Play listing. The
        // shell keeps its own numbering, independent of the web app version.
        // The Play workflow passes -PohmywindVersionCode=<last on Play + 1>
        // (scripts/play-publish.mjs next-version-code); 9 is the last one
        // shipped by hand, and the default for local builds.
        versionCode((project.findProperty('ohmywindVersionCode') ?: '9') as Integer)
        versionName "2.0.0"
        resValue "string", "app_name", shellAppName
        resValue "string", "title_activity_main", shellAppName
        // Host of the variant's site, for the https links that open the app
        // (intent filter with autoVerify in AndroidManifest.xml).
        def shellSite = new URI(shellServerUrl)
        manifestPlaceholders.putAll([shellLinkScheme: shellSite.scheme, shellLinkHost: shellSite.host])
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing with the Play upload key, only when the environment
    // provides it (the Play workflow, or a developer exporting the variables):
    // the key and its password never sit in a file of the repository. Without
    // them, bundleRelease still builds, unsigned.
    def uploadKeystore = System.getenv('OHMYWIND_UPLOAD_KEYSTORE')
    signingConfigs {
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('OHMYWIND_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('OHMYWIND_UPLOAD_KEY_ALIAS') ?: 'android'
                keyPassword System.getenv('OHMYWIND_UPLOAD_KEY_PASSWORD') ?: System.getenv('OHMYWIND_UPLOAD_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadKeystore) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
